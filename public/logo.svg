<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1a23" />
      <stop offset="100%" stop-color="#540f16" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3290" />
      <stop offset="100%" stop-color="#12175e" />
    </linearGradient>
  </defs>

  <!-- 1. Top Graduation Cap (کلاه فارغ‌التحصیلی) -->
  <g transform="translate(0, -10)">
    <!-- Cap Top Diamond -->
    <path d="M 200,20 L 330,85 L 200,140 L 70,85 Z" fill="url(#maroonGrad)" />
    <!-- Cap Under Band -->
    <path d="M 120,95 L 120,135 C 120,165 280,165 280,135 L 280,95 Z" fill="url(#maroonGrad)" opacity="0.95" />
    <!-- Cap Tassel Button & Cord -->
    <circle cx="200" cy="80" r="6" fill="#f59e0b" />
    <path d="M 200,80 Q 285,90 295,120 L 295,150" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <!-- Tassel Fringe -->
    <path d="M 290,150 L 300,150 L 297,175 L 293,175 Z" fill="#f59e0b" />
  </g>

  <!-- 2. Middle 3D Polymer Lattice (شبکه بلوری سه‌بعدی) -->
  <g transform="translate(200, 210)">
    <!-- Struts / Bonds -->
    <path d="M 0,-45 L 45,-15 M 0,-45 L -45,-15 M 0,-45 L 0,35
             M 45,-15 L 45,35 M 45,-15 L -10,15
             M -45,-15 L -45,35 M -45,-15 L 10,15
             M 0,35 L 45,65 M 0,35 L -45,65
             M -45,35 L 0,65 M 45,35 L 0,65"
          fill="none" stroke="url(#blueGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Atoms / Nodes -->
    <circle cx="0" cy="-45" r="14" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="45" cy="-15" r="14" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="-45" cy="-15" r="14" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="#1e1b4b" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="0" cy="35" r="14" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="45" cy="35" r="14" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="-45" cy="35" r="14" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="65" r="14" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- 3. Bottom Open Book (کتاب باز) -->
  <g transform="translate(0, 20)">
    <!-- Left Page -->
    <path d="M 200,310 Q 130,280 60,310 L 60,335 Q 130,305 200,335 Z" fill="url(#maroonGrad)" />
    <!-- Right Page -->
    <path d="M 200,310 Q 270,280 340,310 L 340,335 Q 270,305 200,335 Z" fill="url(#maroonGrad)" />
    <!-- Left Page Under Fold -->
    <path d="M 200,325 Q 130,295 60,325 L 60,345 Q 130,315 200,345 Z" fill="#540f16" opacity="0.8" />
    <!-- Right Page Under Fold -->
    <path d="M 200,325 Q 270,295 340,325 L 340,345 Q 270,315 200,345 Z" fill="#540f16" opacity="0.8" />
  </g>

  <!-- 4. Typography -->
  <!-- Persian Text -->
  <text x="200" y="375" text-anchor="middle" fill="#1e1b4b" font-family="Vazirmatn, Tahoma, sans-serif" font-weight="900" font-size="20">
    انجمن علمی مهندسی پلیمر
  </text>
  <!-- English Text -->
  <text x="200" y="398" text-anchor="middle" fill="#7a1a23" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="13" letter-spacing="0.5">
    Polymer Engineering Association
  </text>
</svg>
