# Local development database for Polypedia.
#
# Deliberately boring: one Postgres container, a named volume, no orchestration.
# The roadmap targets a single-host deployment for a 1-3 person team, so there
# is nothing here to outgrow before there is a reason to.
#
# NO CREDENTIALS ARE COMMITTED. Values come from db/.env (gitignored).
# Copy db/.env.example to db/.env and edit it before first run.

services:
  postgres:
    image: postgres:16-alpine
    container_name: polypedia-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in db/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in db/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in db/.env}
      # Deterministic collation so ORDER BY on Persian text does not change
      # behaviour between the host locale and the container.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Non-default host port so this never collides with a local Postgres.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - polypedia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  polypedia_pgdata:
